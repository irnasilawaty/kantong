<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kantong</title>
<meta name="description" content="Personal budgeting and expense tracker that lives on your device.">
<meta name="theme-color" content="#F4F3FA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Plus Jakarta Sans","Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
  --bg:#F4F3FA;--glow1:rgba(124,92,255,.20);--glow2:rgba(255,122,182,.16);
  --surface:#FFFFFF;--surface-2:#F2F0F9;--glass:rgba(255,255,255,.74);
  --ink:#12101F;--ink-2:#4A4760;--muted:#8C89A3;--line:#ECEAF4;
  --brand:#6C4CF5;--brand-2:#C04CF0;--brand-soft:#EFEBFF;
  --pos:#0FA36B;--neg:#EF4E63;--warn:#F29D0B;
  --shadow:0 1px 2px rgba(20,16,50,.04),0 10px 30px -10px rgba(40,24,110,.14);
  --scrim:rgba(14,10,36,.45);--radius:22px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0913;--glow1:rgba(124,92,255,.24);--glow2:rgba(255,90,170,.12);
  --surface:#15131F;--surface-2:#1E1B2C;--glass:rgba(24,21,38,.72);
  --ink:#F3F1FA;--ink-2:#BDB8D3;--muted:#827D9C;--line:#272339;
  --brand:#9077FF;--brand-2:#D27DFF;--brand-soft:#251E47;
  --pos:#34D399;--neg:#FF6B81;--warn:#FBBF24;
  --shadow:0 0 0 1px rgba(255,255,255,.03),0 12px 30px -12px rgba(0,0,0,.7);--scrim:rgba(0,0,0,.62);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0913;--glow1:rgba(124,92,255,.24);--glow2:rgba(255,90,170,.12);
  --surface:#15131F;--surface-2:#1E1B2C;--glass:rgba(24,21,38,.72);
  --ink:#F3F1FA;--ink-2:#BDB8D3;--muted:#827D9C;--line:#272339;
  --brand:#9077FF;--brand-2:#D27DFF;--brand-soft:#251E47;
  --pos:#34D399;--neg:#FF6B81;--warn:#FBBF24;
  --shadow:0 0 0 1px rgba(255,255,255,.03),0 12px 30px -12px rgba(0,0,0,.7);--scrim:rgba(0,0,0,.62);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);font:500 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  background:radial-gradient(900px 520px at 0% -8%,var(--glow1),transparent 62%),radial-gradient(720px 480px at 100% -4%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
small{font-size:12.5px}
b{font-weight:700}
.muted{color:var(--muted)}.sm{font-size:13px}.center{text-align:center}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- layout ---------- */
.side{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.top .tt{flex:1;min-width:0}
.top h1{font-size:23px;font-weight:800;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--muted);font-size:13px}
.month-nav{display:flex;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);flex-shrink:0;backdrop-filter:blur(10px)}
.month-nav button{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.month-nav button:hover{background:var(--surface-2)}
.month-nav .ml{width:auto;padding:0 6px;font-weight:700;font-size:13px;color:var(--ink);min-width:72px;text-align:center}
.avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;
  background:linear-gradient(135deg,#7B5CFF,#D24CF0);box-shadow:0 8px 18px -8px #7B5CFF}
main{padding:2px 18px calc(124px + env(safe-area-inset-bottom));max-width:1120px;margin:0 auto}
.stack>*+*{margin-top:16px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.enter .an{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}

/* bottom nav */
.bnav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;height:70px;border-radius:26px;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 16px 40px -14px rgba(30,18,80,.35);max-width:520px;margin:0 auto}
.bnav .ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);transition:color .2s}
.bnav .ni.on{color:var(--brand)}
.bnav .ni .dot{width:4px;height:4px;border-radius:9px;background:currentColor;opacity:0;transition:opacity .2s}
.bnav .ni.on .dot{opacity:1}
.bnav .ni span:not(.dot){display:none}
.bn-add{justify-self:center;width:60px;height:60px;border-radius:22px;display:grid;place-items:center;color:#fff;transform:translateY(-18px);
  background:linear-gradient(135deg,#7B5CFF,#C04CF0 60%,#FF6FA8);box-shadow:0 14px 26px -8px rgba(123,92,255,.75),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.bn-add:active{transform:translateY(-18px) scale(.93)}
@media (min-width:420px){.bnav .ni span:not(.dot){display:block}.bnav .ni .dot{display:none}}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:24px 16px;background:var(--glass);border-right:1px solid var(--line);backdrop-filter:blur(20px)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:4px 10px 22px}
  .brand img{width:38px;height:38px;border-radius:12px;box-shadow:0 8px 18px -8px #7B5CFF}
  .side .nav-i{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;color:var(--ink-2);transition:background .15s}
  .side .nav-i:hover{background:var(--surface-2)}
  .side .nav-i.on{background:var(--brand-soft);color:var(--brand)}
  .side .btn{margin-top:16px}
  .side .kbd{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
  .bnav,.avatar{display:none}
  main{padding:4px 34px 56px}
  .top{padding:24px 34px 16px}
  .grid-2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
  .grid-2>.stack+.stack{margin-top:0}
}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.card-h h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
.sec-h h3{font-size:17px;font-weight:800;letter-spacing:-.015em}
.link{color:var(--brand);font-weight:700;font-size:13.5px}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.big{font-size:23px;font-weight:800;letter-spacing:-.03em}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 16px;color:#fff;isolation:isolate;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,122,182,.6),transparent 55%),radial-gradient(90% 80% at 0% 110%,rgba(70,200,255,.38),transparent 60%),linear-gradient(140deg,#24166A,#5A2BD9 52%,#8E3BE8);
  box-shadow:0 26px 50px -22px rgba(90,43,217,.75)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.18);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;opacity:.9}
.eye{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.hero-amt{font-size:36px;font-weight:800;letter-spacing:-.035em;margin:4px 0 6px;line-height:1.1;overflow-wrap:anywhere}
.chg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px 5px 6px;border-radius:999px;background:rgba(255,255,255,.16)}
.chg i{width:18px;height:18px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.25);font-style:normal}
.spark{display:block;width:calc(100% + 40px);height:74px;margin:6px -20px 4px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hs{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);min-width:0}
.hs-ic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.hs-ic.in{background:#34D399;color:#053B27}.hs-ic.out{background:#FF8FB1;color:#4A0A22}
.hs small{display:block;opacity:.8;font-size:11.5px}
.hs b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.q-ic{--c:#6C4CF5;width:100%;max-width:64px;aspect-ratio:1;border-radius:22px;display:grid;place-items:center;color:var(--c);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
.q-ic svg{padding:9px;width:44px;height:44px;border-radius:15px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.quick button:active .q-ic{transform:scale(.94)}

/* rings & bars */
.ring-wrap{position:relative;flex-shrink:0}
.ring-wrap .rl{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.02em}
.ring-bg{stroke:var(--surface-2)}
@keyframes ringIn{from{stroke-dasharray:0 1000}}
.ring-fg{animation:ringIn 1s cubic-bezier(.2,.8,.2,1) both}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.budget-card{display:flex;gap:18px;align-items:center;width:100%}
.budget-card .bt{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.2;margin:2px 0 4px}

/* week chart */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:128px;align-items:end}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
.wk-b{flex:1;width:100%;max-width:30px;border-radius:10px;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.wk-b i{width:100%;border-radius:10px;background:color-mix(in srgb,var(--brand) 38%,var(--surface-2));transform-origin:bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) both}
.wk-d.on .wk-b i{background:linear-gradient(180deg,#B07CFF,#6C4CF5)}
.wk-d span{font-size:11.5px;font-weight:700;color:var(--muted)}
.wk-d.on span{color:var(--brand)}
.wk-d.fut .wk-b{opacity:.5}
@keyframes growY{from{transform:scaleY(0)}}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.delta.pos{background:color-mix(in srgb,var(--pos) 13%,transparent)}
.delta.neg{background:color-mix(in srgb,var(--neg) 12%,transparent)}

/* account cards */
.accs{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 14px;margin:0 -18px;scroll-snap-type:x mandatory;scroll-padding-inline:18px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.acard{position:relative;overflow:hidden;flex:0 0 auto;width:208px;height:128px;border-radius:22px;padding:15px 16px;color:#fff;scroll-snap-align:start;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 30px -18px rgba(20,10,60,.7);isolation:isolate;transition:transform .15s}
.acard:active{transform:scale(.97)}
.acard::before,.acard::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);z-index:-1}
.acard::before{width:160px;height:160px;right:-60px;top:-70px}
.acard::after{width:110px;height:110px;right:20px;bottom:-70px;background:rgba(255,255,255,.08)}
.ac-top{display:flex;justify-content:space-between;align-items:center}
.ac-top svg{opacity:.95}
.ac-cur{font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.2)}
.ac-name{font-size:12.5px;font-weight:600;opacity:.85}
.ac-bal{font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-cash{background:linear-gradient(135deg,#047857,#10B981 60%,#6EE7B7)}
.t-bank{background:linear-gradient(135deg,#312E81,#5B21B6 55%,#8B5CF6)}
.t-card{background:linear-gradient(135deg,#0F172A,#334155 60%,#64748B)}
.t-ewallet{background:linear-gradient(135deg,#075985,#0284C7 55%,#38BDF8)}
.t-savings{background:linear-gradient(135deg,#9D174D,#DB2777 55%,#F9A8D4)}
.t-invest{background:linear-gradient(135deg,#92400E,#D97706 55%,#FCD34D)}
.acard.add{background:var(--surface);color:var(--muted);border:1.5px dashed var(--line);box-shadow:none;width:120px;align-items:center;justify-content:center;gap:6px;font-weight:700}
.acard.add::before,.acard.add::after{display:none}

/* rows */
.list{overflow:hidden}
.tx,.row{display:flex;align-items:center;gap:13px;width:100%;padding:12px 16px;transition:background .15s}
.tx:hover,.row:hover{background:var(--surface-2)}
.list>*+*{border-top:1px solid var(--line)}
.ic{--c:#64748B;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 62%,#fff),var(--c));box-shadow:0 6px 14px -7px var(--c),inset 0 1px 0 rgba(255,255,255,.35)}
.ic .emo{font-size:19px;line-height:1}
.ic.soft{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);box-shadow:none}
.tx-m,.row-m{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-m b,.row-m b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-m small,.row-m small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-r{text-align:right;display:flex;flex-direction:column;flex-shrink:0}
.tx-r b{font-weight:800;letter-spacing:-.01em}
.tx-r small{color:var(--muted)}
.tx-r.muted b{color:var(--ink-2)}
.tx-r.pos b{color:var(--pos)}
.rep{color:var(--brand)}
.chev{color:var(--muted);flex-shrink:0}
.day-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin:20px 6px 8px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{display:flex;align-items:center;gap:11px;padding:13px 14px}
.mini b{display:block;font-size:16px;letter-spacing:-.02em}
.mini small{color:var(--muted)}

/* search & chips */
.search{display:flex;align-items:center;gap:9px;height:50px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:17px;color:var(--muted);box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.chip.on{background:linear-gradient(135deg,#7B5CFF,#C04CF0);color:#fff;border-color:transparent;box-shadow:0 8px 16px -8px #7B5CFF}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13.5px;font-weight:600;min-width:0}

/* plan */
.brow{display:flex;gap:13px;align-items:center;width:100%;padding:15px 16px}
.brow:hover{background:var(--surface-2)}
.brow .bm{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.btop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.btop b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btop span{font-size:13px;color:var(--muted);white-space:nowrap}
.btop span b{color:var(--ink)}
.bsub{font-size:12.5px;color:var(--muted)}
.bsum{display:flex;align-items:center;gap:18px}
.bsum .grid{flex:1;display:grid;gap:10px}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.goal{padding:16px;display:flex;flex-direction:column;gap:14px}
.goal-main{display:flex;align-items:center;gap:14px}
.goal-main>div:last-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.goal-main small{color:var(--muted)}

/* insights */
.donut-wrap{position:relative;width:210px;height:210px;margin:2px auto 12px}
.donut-wrap svg{width:100%;height:100%}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-c b{font-size:21px;letter-spacing:-.03em;max-width:130px;overflow-wrap:anywhere}
.donut-seg{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.leg{display:flex;align-items:center;gap:11px;padding:8px 0}
.leg .ic{width:34px;height:34px;border-radius:11px}
.leg .ln{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.leg .ln span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:14px}
.leg .bar{height:6px}
.leg .la{font-weight:800;min-width:80px;text-align:right;display:flex;flex-direction:column}
.leg .la small{color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:15px 16px;display:flex;flex-direction:column;gap:3px}
.tile .ic{width:34px;height:34px;border-radius:11px;margin-bottom:8px}
.tile b{font-size:19px;letter-spacing:-.025em;overflow-wrap:anywhere}
.tile small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.ax{fill:var(--muted);font-size:18px;font-weight:600;font-family:var(--font)}
.ax.on{fill:var(--ink);font-weight:800}
.gl{stroke:var(--line);stroke-dasharray:3 4}
.legend-inline{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600}
.legend-inline i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.line-anim{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade-in{animation:fadeIn 1s .3s both}
@keyframes fadeIn{from{opacity:0}}

/* more */
.profile{display:flex;align-items:center;gap:14px;padding:18px;color:#fff;border:0;
  background:radial-gradient(100% 120% at 100% 0%,rgba(255,122,182,.5),transparent 60%),linear-gradient(140deg,#24166A,#5A2BD9 60%,#8E3BE8)}
.profile .avatar{display:grid;width:54px;height:54px;border-radius:18px;font-size:22px;background:rgba(255,255,255,.18);box-shadow:none}
.profile b{font-size:18px;letter-spacing:-.02em}
.profile small{opacity:.8}
.set-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 8px 9px}
.row .val{color:var(--muted);font-size:14px;font-weight:600;flex-shrink:0}

/* ---------- buttons & forms ---------- */
.btn{height:50px;border-radius:16px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{color:#fff;background:linear-gradient(135deg,#7B5CFF,#C04CF0 70%,#FF6FA8);box-shadow:0 12px 24px -12px rgba(123,92,255,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{color:var(--neg)}
.btn.sm{height:40px;font-size:14px;border-radius:13px;padding:0 14px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}

.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s;backdrop-filter:blur(4px)}
.sheet-wrap.open{opacity:1}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:30px 30px 0 0;
  padding:8px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(60px);transition:transform .35s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet-wrap.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
@media (min-width:700px){
  .sheet-wrap{align-items:center}
  .sheet{border-radius:30px;padding:14px 26px 26px;transform:translateY(20px) scale(.97)}
  .grab{display:none}
}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.sh-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.sh-actions{display:flex;gap:10px;margin-top:20px}
.sh-actions .btn.primary{flex:1}
.sheet .stack>*+*{margin-top:15px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:16px;padding:4px}
.seg button{text-align:center;height:40px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(20,10,60,.1)}
.seg button.on[data-v="expense"]{color:var(--neg)}
.seg button.on[data-v="income"]{color:var(--pos)}
.seg button.on[data-v="transfer"]{color:var(--brand)}

.amount{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:14px 0 2px;cursor:text}
.amount span{font-size:22px;font-weight:700;color:var(--muted)}
.amount input{border:0;outline:0;background:transparent;font-size:46px;font-weight:800;letter-spacing:-.04em;text-align:center;
  field-sizing:content;min-width:1.5ch;max-width:100%;width:100%;padding:0;caret-color:var(--brand)}
@supports (field-sizing:content){.amount input{width:auto}}
.amount input::placeholder{color:var(--line)}
.amount.t-expense input{color:var(--ink)}
.amount.t-income input{color:var(--pos)}
.conv-hint{text-align:center;color:var(--muted);font-size:13px;font-weight:600;min-height:18px}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.cat{--c:#64748B;display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 4px 10px;border-radius:17px;background:var(--surface-2);
  font-size:11.5px;font-weight:700;color:var(--ink-2);border:2px solid transparent;text-align:center;line-height:1.2;transition:all .15s}
.cat .ic{width:36px;height:36px;border-radius:12px}
.cat.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--ink)}
.fld{display:grid;gap:7px}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:700}
.fld input,.fld select{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 13px;width:100%;min-width:0;outline:0;font-weight:600}
.fld input:focus,.fld select:focus,.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--neg);font-size:13.5px;font-weight:700;text-align:center}
.err:empty{display:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:32px;height:32px;border-radius:11px;border:3px solid var(--surface);box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.icons button{height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);border:2px solid transparent}
.icons button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.hint-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .ic{margin:0 auto 12px;width:54px;height:54px;border-radius:18px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:3px}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px}
.banner .tx-m small{white-space:normal}

.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,20px) scale(.96);opacity:0;pointer-events:none;z-index:80;
  background:#16132A;color:#fff;border-radius:18px;padding:12px 16px 12px 12px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;
  transition:all .3s cubic-bezier(.2,.9,.25,1);box-shadow:0 18px 40px -10px rgba(0,0,0,.45);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast .tk{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#34D399,#0FA36B);flex-shrink:0}
.toast button{color:#C9B8FF;font-weight:800;margin-left:4px}
@media (min-width:900px){.toast{bottom:32px}}

/* welcome */
body.welcoming .top,body.welcoming .bnav,body.welcoming .side{visibility:hidden}
.welcome{text-align:center}
.w-art{position:relative;height:150px;margin:6px auto 18px;max-width:300px}
.w-art .acard{position:absolute;left:50%;width:190px;height:116px;box-shadow:0 20px 40px -18px rgba(20,10,60,.8)}
.w-art .acard:nth-child(1){transform:translateX(-50%) translate(-58px,22px) rotate(-12deg)}
.w-art .acard:nth-child(2){transform:translateX(-50%) translate(58px,22px) rotate(10deg)}
.w-art .acard:nth-child(3){transform:translateX(-50%) translateY(0)}
@keyframes float{50%{translate:0 -6px}}
.w-art .acard:nth-child(3){animation:float 4s ease-in-out infinite}
.welcome h2{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.grad{background:linear-gradient(90deg,#7B5CFF,#D24CF0,#FF6FA8);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);margin:8px auto 20px;max-width:340px}
.welcome .fld{text-align:left}
.cur-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cur-pick button{height:56px;border-radius:15px;background:var(--surface-2);font-weight:800;font-size:13.5px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.cur-pick button small{font-weight:600;color:var(--muted);font-size:11px}
.cur-pick button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* receipt scan */
.scan-prev{position:relative;border-radius:20px;overflow:hidden;background:var(--surface-2)}
.scan-prev img{display:block;width:100%;max-height:300px;object-fit:cover;object-position:top}
.scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--brand),transparent);box-shadow:0 0 18px var(--brand);animation:scanY 1.8s ease-in-out infinite}
@keyframes scanY{0%,100%{top:4%}50%{top:94%}}
.scan-note{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:14px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px;margin-bottom:14px}
.scan-note.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.sh-head .tools{display:flex;gap:8px}

/* gold */
.t-gold{background:linear-gradient(135deg,#7A5200,#C9930E 50%,#F5D76E)}
.sum-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ta-r{text-align:right}
.gold-card{width:100%;display:block}
.gold-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:-4px}
.gold-spark{display:block;width:100%;height:46px;margin-top:10px}
.gp{padding:18px;border-radius:22px;color:#3B2A00;background:linear-gradient(135deg,#FFE7A0,#F7CF55 60%,#E9B730);box-shadow:0 14px 30px -16px rgba(201,147,14,.8)}
.gp .big{font-size:28px}
.gp .lbl,.gp small{color:#6B5210}
.gp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gp .icon-btn{background:rgba(255,255,255,.55);color:#3B2A00}
.gp .pos{color:#0B7A4F}.gp .neg{color:#B42335}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Cute style ---------- */
:root[data-style="cute"]{
  --font:"Nunito","Segoe UI",system-ui,sans-serif;--font-h:"Fredoka","Nunito",system-ui,sans-serif;
  --bg:#FFF5F8;--glow1:rgba(255,182,210,.55);--glow2:rgba(186,225,255,.55);
  --surface:#FFFFFF;--surface-2:#FFF0F5;--glass:rgba(255,255,255,.85);
  --ink:#4B3A52;--ink-2:#7B6582;--muted:#B49BBB;--line:#F8E1EA;
  --brand:#F2649E;--brand-2:#FF9CC2;--brand-soft:#FFE4EF;
  --pos:#2FBF8F;--neg:#FF6F86;--warn:#FFA94D;
  --shadow:0 4px 0 #F6DCE6;--radius:28px;--scrim:rgba(90,50,80,.35);--press:#D94C86;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root[data-style="cute"]:not([data-theme="light"]){
  --bg:#221A2C;--glow1:rgba(255,120,180,.22);--glow2:rgba(120,170,255,.18);
  --surface:#2E2440;--surface-2:#3A2D50;--glass:rgba(46,36,64,.88);
  --ink:#FFF0F6;--ink-2:#E6CFE6;--muted:#A88FB8;--line:#4A3B62;
  --brand:#FF8DBB;--brand-2:#FFB8D4;--brand-soft:#4A2D4E;--pos:#5EE0B0;--neg:#FF8A9C;
  --shadow:0 4px 0 #17111F;--scrim:rgba(0,0,0,.55);color-scheme:dark;
}}
:root[data-style="cute"][data-theme="dark"]{
  --bg:#221A2C;--glow1:rgba(255,120,180,.22);--glow2:rgba(120,170,255,.18);
  --surface:#2E2440;--surface-2:#3A2D50;--glass:rgba(46,36,64,.88);
  --ink:#FFF0F6;--ink-2:#E6CFE6;--muted:#A88FB8;--line:#4A3B62;
  --brand:#FF8DBB;--brand-2:#FFB8D4;--brand-soft:#4A2D4E;--pos:#5EE0B0;--neg:#FF8A9C;
  --shadow:0 4px 0 #17111F;--scrim:rgba(0,0,0,.55);color-scheme:dark;
}
[data-style="cute"] body{font-weight:600}
[data-style="cute"] :is(.top h1,.sec-h h3,.card-h h3,.big,.hero-amt,.sh-head h2,.welcome h2,.brand,.bt,.ac-bal,.tile b,.donut-c b,.profile b,.mini b){font-family:var(--font-h);font-weight:600;letter-spacing:0}
[data-style="cute"] .card{border:2px solid var(--line)}
[data-style="cute"] .hero{color:#4B3A52;border:2px solid #fff;box-shadow:0 6px 0 #F4B5CB;
  background:radial-gradient(90% 90% at 100% 0%,#FFE7A8,transparent 55%),radial-gradient(80% 80% at 0% 100%,#C4E8FF,transparent 60%),linear-gradient(135deg,#FFB3CF,#FFC9DD 50%,#FFD9C2)}
[data-style="cute"] .hero::after{display:none}
[data-style="cute"] :is(.eye,.chg,.hs){background:rgba(255,255,255,.6);color:#4B3A52}
[data-style="cute"] .chg i{background:#fff}
[data-style="cute"] .spark .line-anim{stroke:#E8558F}
[data-style="cute"] .hs-ic.in{background:#B8F0D9;color:#1E8A63}
[data-style="cute"] .hs-ic.out{background:#FFD1DD;color:#D9466F}
[data-style="cute"] .q-ic{border:2px solid var(--line);border-radius:24px}
[data-style="cute"] .ic{background:color-mix(in srgb,var(--c) 24%,var(--surface));color:color-mix(in srgb,var(--c) 80%,var(--ink));box-shadow:none;border-radius:16px}
[data-style="cute"] .acard{color:#4B3A52;border:2px solid rgba(255,255,255,.75);box-shadow:0 5px 0 rgba(120,60,100,.12)}
[data-style="cute"] .acard::before{background:rgba(255,255,255,.4)}
[data-style="cute"] .acard::after{background:rgba(255,255,255,.3)}
[data-style="cute"] .ac-cur{background:rgba(255,255,255,.65)}
[data-style="cute"] .t-cash{background:linear-gradient(135deg,#A8EDCF,#DDF9EC)}
[data-style="cute"] .t-bank{background:linear-gradient(135deg,#CDBDFF,#EEE8FF)}
[data-style="cute"] .t-card{background:linear-gradient(135deg,#FFC9A8,#FFE9DB)}
[data-style="cute"] .t-ewallet{background:linear-gradient(135deg,#ACDCFF,#E0F2FF)}
[data-style="cute"] .t-savings{background:linear-gradient(135deg,#FFB3CF,#FFE3EE)}
[data-style="cute"] .t-invest{background:linear-gradient(135deg,#FFE08A,#FFF5D1)}
[data-style="cute"] .t-gold{background:linear-gradient(135deg,#FFD36E,#FFF1BF)}
[data-style="cute"] .gp{border:2px solid #fff;box-shadow:0 5px 0 #EBC768}
[data-style="cute"] .ic[class*="t-"]{color:#4B3A52}
[data-style="cute"] .acard.add{background:var(--surface);color:var(--muted);border:2px dashed var(--line);box-shadow:none}
[data-style="cute"] .btn.primary{background:linear-gradient(180deg,#FF8DBB,#F2649E);box-shadow:0 4px 0 var(--press)}
[data-style="cute"] .btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
[data-style="cute"] .btn{border-radius:18px}
[data-style="cute"] .bn-add{border-radius:50%;background:linear-gradient(180deg,#FF9CC4,#F2649E);box-shadow:0 5px 0 var(--press),0 14px 22px -8px rgba(242,100,158,.6)}
[data-style="cute"] .bnav{border:2px solid var(--line);box-shadow:0 5px 0 var(--line);border-radius:30px}
[data-style="cute"] .avatar{border-radius:50%;background:linear-gradient(180deg,#FF9CC4,#F2649E);box-shadow:0 4px 0 var(--press)}
[data-style="cute"] .chip.on{background:var(--brand);box-shadow:0 3px 0 var(--press)}
[data-style="cute"] .bar{height:12px}
[data-style="cute"] .wk-b{border-radius:14px}
[data-style="cute"] .wk-b i{border-radius:14px;background:color-mix(in srgb,var(--brand) 30%,var(--surface-2))}
[data-style="cute"] .wk-d.on .wk-b i{background:linear-gradient(180deg,#FFB3CF,#F2649E)}
[data-style="cute"] .profile{color:#4B3A52;border:2px solid #fff;box-shadow:0 5px 0 #F4B5CB;background:linear-gradient(135deg,#FFB3CF,#FFD9C2)}
[data-style="cute"] .profile .avatar{background:rgba(255,255,255,.7);color:#F2649E;box-shadow:none}
[data-style="cute"] .toast{background:#F2649E}
[data-style="cute"] .toast .tk{background:#fff;color:#F2649E}
[data-style="cute"] .toast button{color:#fff;text-decoration:underline}
[data-style="cute"] .sheet{border:2px solid var(--line);border-bottom:0}
[data-style="cute"] .grad{background:linear-gradient(90deg,#F2649E,#FF9F6E);-webkit-background-clip:text;background-clip:text}
[data-style="cute"] .side .nav-i{border-radius:18px}
[data-style="cute"] .enter .an{animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
[data-style="cute"] #gBrand stop:first-child,[data-style="cute"] #gBarOut stop:first-child{stop-color:#FFB0CD}
[data-style="cute"] #gBrand stop:last-child,[data-style="cute"] #gBarOut stop:last-child{stop-color:#F2649E}
[data-style="cute"] #gArea stop{stop-color:#FF8DBB}
.buddy{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 10px}
.mascot{flex-shrink:0;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}
.bubble{position:relative;flex:1;background:var(--surface-2);border-radius:20px;padding:11px 14px;font-weight:700;color:var(--ink-2);font-size:14px;line-height:1.4}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--surface-2);border-left:0}
.bubble b{color:var(--brand)}
.empty .mascot{display:block;margin:0 auto 8px}
.style-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.style-pick button{height:60px;border-radius:16px;background:var(--surface-2);border:2px solid transparent;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.style-pick button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.style-pick .sw{width:26px;height:26px;border-radius:9px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.line-anim{stroke-dashoffset:0}}
</style>
</head>
<body>
<svg class="svgdefs" aria-hidden="true"><defs>
  <linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B5CFF"/><stop offset="1" stop-color="#E05CC8"/></linearGradient>
  <linearGradient id="gPos" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#0FA36B"/></linearGradient>
  <linearGradient id="gBarIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE9B"/><stop offset="1" stop-color="#0FA36B"/></linearGradient>
  <linearGradient id="gBarOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B98CFF"/><stop offset="1" stop-color="#6C4CF5"/></linearGradient>
  <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8D6BFF" stop-opacity=".38"/><stop offset="1" stop-color="#8D6BFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="gSpark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs></svg>
<div class="app">
  <aside class="side" id="side"></aside>
  <div>
    <header class="top">
      <div class="tt"><h1 id="title">Kantong</h1><div class="sub" id="sub"></div></div>
      <div class="month-nav" id="monthNav">
        <button data-a="month" data-id="-1" aria-label="Previous month"></button>
        <button class="ml" data-a="month" data-id="0" id="monthLabel" title="Back to this month"></button>
        <button data-a="month" data-id="1" aria-label="Next month"></button>
      </div>
      <button class="avatar" id="avatar" data-a="nav" data-id="more" aria-label="Settings"></button>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="scanInput" accept="image/*" hidden>

<script>
(() => {
'use strict';

const KEY = 'kantong.v1';
const CUR = {
  IDR: { sym: 'Rp', dec: 0, name: 'Indonesian Rupiah' },
  SGD: { sym: 'S$', dec: 2, name: 'Singapore Dollar' },
  AUD: { sym: 'A$', dec: 2, name: 'Australian Dollar' },
  USD: { sym: 'US$', dec: 2, name: 'US Dollar' },
  JPY: { sym: '¥', dec: 0, name: 'Japanese Yen' },
};
const CODES = Object.keys(CUR);
const ACC_TYPES = { cash: ['cash', 'Cash'], bank: ['bank', 'Bank'], card: ['card', 'Card'], ewallet: ['phone', 'E-wallet'], savings: ['piggy', 'Savings'], invest: ['trend', 'Investment'] };
const SWATCHES = ['#FF8A3D', '#F5B014', '#22C55E', '#14B8A6', '#06B6D4', '#3B82F6', '#6366F1', '#8B5CF6', '#A855F7', '#D946EF', '#EC4899', '#EF4444', '#64748B', '#10B981'];
const CAT_ICONS = ['food', 'coffee', 'cart', 'car', 'fuel', 'home', 'bolt', 'wifi', 'phone', 'bag', 'shirt', 'heart', 'dumbbell', 'film', 'game', 'plane', 'beach', 'book', 'grad', 'gift', 'paw', 'repeat', 'briefcase', 'trend', 'sparkle', 'coins', 'piggy', 'shield', 'laptop', 'box'];

function txDelta(t) {

    n++;

function processRecurring() {
  const t = today();
  let n = 0;
  for (const r of S.recurring) {

const sheets = [];
function sheet(html, mount, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(wrap);
  const close = () => {
    const i = sheets.indexOf(close);
    if (i >= 0) sheets.splice(i, 1);
    wrap.classList.remove('open');
    setTimeout(() => wrap.remove(), 260);
  };
  close.locked = !!opts.locked;
  sheets.push(close);
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  if (!opts.locked) {
    wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
    wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  }
  if (mount) mount(wrap.querySelector('.sheet'), close);
  return close;
}

function actList() {

    if (ui.fa && t.account !== ui.fa && t.to !== ui.fa) return false;
    if (ui.fc && t.cat !== ui.fc) return false;
    if (q) {
      const k = t.type === 'transfer' ? 'transfer' : catOf(t.cat).name;
      const hay = `${t.note || ''} ${k} ${accName(t.account)} ${t.to ? accName(t.to) : ''} ${t.amount}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }));
  if (!list.length) return `<div class="card" style="margin-top:16px">${q ? empty('search', '#7B5CFF', 'Nothing found', `<small>No matches for “${esc(ui.q)}”.</small>`) : empty('calendar', '#7B5CFF', `Nothing in ${monthName(ui.month)}`, '<small>Tap + to add a transaction.</small>')}</div>`;
  let out = 0, inn = 0;

  let h = `<div class="minis">
    <div class="card mini">${tile('i:up', '#EF4E63', 'soft', 18)}<div><small>Money out</small><b>${money(out, S.base, { compact: true })}</b></div></div>
    <div class="card mini">${tile('i:down', '#0FA36B', 'soft', 18)}<div><small>Money in</small><b class="pos">${money(inn, S.base, { compact: true })}</b></div></div></div>`;
  const groups = {};
  for (const t of list) (groups[t.date] = groups[t.date] || []).push(t);
  for (const [d, ts] of Object.entries(groups)) {
    const dayOut = ts.reduce((s, t) => s + (t.type === 'expense' ? conv(t.amount, accCur(t.account)) : 0), 0);
    h += `<div class="day-h"><span>${dayLabel(d)}${q && !d.startsWith(String(new Date().getFullYear())) ? ' ' + d.slice(0, 4) : ''}</span><span>${dayOut ? money(-dayOut) : ''}</span></div><div class="card list">${ts.map(txRow).join('')}</div>`;

}

function vPlan() {

  const bt = withB.reduce((s, c) => s + S.budgets[c.id], 0), bs = withB.reduce((s, c) => s + (st.byCat[c.id] || 0), 0);
  withB.sort((a, b) => (st.byCat[b.id] || 0) / S.budgets[b.id] - (st.byCat[a.id] || 0) / S.budgets[a.id]);

  }
  const brow = (c, has) => {

  } else {

function donut(parts, total) {
  const r = 80, C = 2 * Math.PI * r, gap = parts.length > 1 ? 3 : 0;
  let off = 0;
  const segs = parts.map((p, i) => {
    const full = p.v / total * C, len = Math.max(0.5, full - gap);
    const s = `<circle class="donut-seg" style="animation-delay:${i * 60}ms" r="${r}" cx="100" cy="100" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"/>`;
    off += full;
    return s;
  }).join('');
  return `<svg viewBox="0 0 200 200"><g transform="rotate(-90 100 100)"><circle class="ring-bg" r="${r}" cx="100" cy="100" fill="none" stroke-width="22"/>${segs}</g></svg>`;
}
function barsChart(months) {
  const W = 640, H = 250, L = 64, R = 6, T = 14, B = 36, ih = H - T - B;
  const max = Math.max(1, ...months.flatMap(m => [m.inc, m.exp]));
  const gw = (W - L - R) / months.length, bw = Math.min(26, gw / 3.2);
  let s = '';
  for (let i = 0; i <= 3; i++) {
    const y = T + ih - ih * i / 3;
    s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 10}" y="${y + 4}" text-anchor="end">${money(max * i / 3, S.base, { compact: true }).replace(/^\S+ /, '')}</text>`;
  }
  months.forEach((m, i) => {
    const cx = L + gw * i + gw / 2, hi = ih * m.inc / max, he = ih * m.exp / max;
    s += `<rect class="fade-in" x="${cx - bw - 3}" y="${T + ih - hi}" width="${bw}" height="${Math.max(0, hi)}" rx="7" fill="url(#gBarIn)" style="animation-delay:${i * 70}ms"><title>Income ${money(m.inc)}</title></rect>`;
    s += `<rect class="fade-in" x="${cx + 3}" y="${T + ih - he}" width="${bw}" height="${Math.max(0, he)}" rx="7" fill="url(#gBarOut)" style="animation-delay:${i * 70 + 35}ms"><title>Spent ${money(m.exp)}</title></rect>`;
    s += `<text class="ax ${m.k === ui.month ? 'on' : ''}" x="${cx}" y="${H - 8}" text-anchor="middle">${monthShort(m.k)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending, last 6 months">${s}</svg>`;
}
function paceChart(k) {
  const [y, m] = k.split('-').map(Number), dN = daysIn(y, m);
  const pk = shiftMonth(k, -1), [py, pm] = pk.split('-').map(Number), pN = daysIn(py, pm);
  const cum = (key, n) => {
    const a = Array(n).fill(0);
    for (const t of S.tx) if (t.type === 'expense' && t.date.startsWith(key)) a[+t.date.slice(8) - 1] += conv(t.amount, accCur(t.account));
    for (let i = 1; i < n; i++) a[i] += a[i - 1];
    return a;
  };
  const cur = cum(k, dN), prv = cum(pk, pN);
  const isCur = k === mkey(new Date()), lastIdx = isCur ? new Date().getDate() - 1 : dN - 1;
  const N = Math.max(dN, pN), max = Math.max(1, cur[lastIdx], prv[pN - 1]);
  const W = 640, H = 220, L = 6, R = 6, T = 18, B = 34;
  const x = i => L + (W - L - R) * i / (N - 1), yy = v => T + (H - T - B) * (1 - v / max);
  const cp = cur.slice(0, lastIdx + 1).map((v, i) => [x(i), yy(v)]), pp = prv.map((v, i) => [x(i), yy(v)]);
  const line = smooth(cp), lp = cp[cp.length - 1];
  let s = '';
  for (let i = 0; i <= 3; i++) { const gy = T + (H - T - B) * i / 3; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${gy}" y2="${gy}"/>`; }
  s += `<path d="${smooth(pp)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 6" opacity=".7"/>`;
  if (cp.length > 1) s += `<path class="fade-in" d="${line} L${lp[0]},${H - B} L${x(0)},${H - B} Z" fill="url(#gArea)"/>`;
  s += `<path class="line-anim" d="${line}" fill="none" stroke="url(#gBrand)" stroke-width="3.2" stroke-linecap="round"/>`;
  s += `<circle class="fade-in" cx="${lp[0]}" cy="${lp[1]}" r="5.5" fill="var(--surface)" stroke="#8D6BFF" stroke-width="3"/>`;
  for (const d of [1, 10, 20, N]) s += `<text class="ax" x="${x(d - 1)}" y="${H - 6}" text-anchor="${d === 1 ? 'start' : d === N ? 'end' : 'middle'}">${d}</text>`;
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative spending this month vs last month">${s}</svg>`, now: cur[lastIdx], then: prv[Math.min(lastIdx, pN - 1)] };
}
function vInsights() {
  const st = monthStats(ui.month), isCur = ui.month === mkey(new Date());
  const prev = monthStats(shiftMonth(ui.month, -1), isCur ? new Date().getDate() : 31);
  const parts = Object.entries(st.byCat).map(([id, v]) => ({ id, v, ...catOf(id) })).sort((a, b) => b.v - a.v);
  if (parts.length > 7) { const rest = parts.splice(6); parts.push({ name: `${rest.length} others`, icon: 'i:box', color: '#94A3B8', v: rest.reduce((s, p) => s + p.v, 0) }); }
  let h = '<div class="grid-2"><div class="stack">';
  h += `<section class="card pad an"><div class="card-h"><h3>Where it went</h3>`;
  if (prev.exp > 0 && st.exp > 0) {
    const d = (st.exp - prev.exp) / prev.exp;
    h += `<span class="delta ${d > 0 ? 'neg' : 'pos'}">${d > 0 ? '▲' : '▼'} ${Math.abs(Math.round(d * 100))}% vs ${monthShort(shiftMonth(ui.month, -1))}</span>`;
  }
  h += '</div>';
  if (!parts.length) h += empty('insights', '#7B5CFF', 'No spending this month', '<small>Your breakdown will appear here.</small>');
  else {
    h += `<div class="donut-wrap">${donut(parts, st.exp)}<div class="donut-c"><small class="muted">Total spent</small><b>${money(st.exp, S.base, { compact: true })}</b><small class="muted">${monthName(ui.month)}</small></div></div>`;
    h += parts.map(p => `<div class="leg">${tile(p.icon, p.color, '', 17)}<div class="ln"><span>${esc(p.name)}</span><div class="bar"><i style="width:${(p.v / parts[0].v * 100).toFixed(1)}%;background:${p.color}"></i></div></div><div class="la">${money(p.v, S.base, { compact: true })}<small>${Math.round(p.v / st.exp * 100)}%</small></div></div>`).join('');

    <div class="card tile">${tile('i:piggy', '#0FA36B', '', 17)}<small>Saved of income</small><b class="${rate === null ? '' : rate >= 0 ? 'pos' : 'neg'}">${rate === null ? '—' : Math.round(rate * 100) + '%'}</b></div>
    <div class="card tile">${tile('i:flame', '#EF4E63', '', 17)}<small>Biggest expense</small><b>${st.biggest ? money(st.biggest.v, S.base, { compact: true }) : '—'}</b><small>${st.biggest ? esc(st.biggest.t.note || catOf(st.biggest.t.cat).name) : ''}</small></div>
    <div class="card tile">${tile('i:receipt', '#3B82F6', '', 17)}<small>Transactions</small><b>${st.n}</b><small>${parts[0] ? 'Top: ' + esc(parts[0].name) : ''}</small></div></div>`;
  const pace = paceChart(ui.month);
  h += `<section class="card pad chart an"><div class="card-h"><div><h3>Spending pace</h3><small class="muted">${isCur ? 'So far this month' : monthName(ui.month)}: <b style="color:var(--ink)">${money(pace.now, S.base, { compact: true })}</b> vs ${money(pace.then, S.base, { compact: true })} in ${monthShort(shiftMonth(ui.month, -1))}</small></div></div>
    ${pace.svg}<div class="legend-inline" style="margin-top:10px"><span><i style="background:linear-gradient(90deg,#7B5CFF,#E05CC8)"></i>${monthShort(ui.month)}</span><span><i style="background:var(--muted);opacity:.6"></i>${monthShort(shiftMonth(ui.month, -1))}</span></div></section>`;
  const months = [5, 4, 3, 2, 1, 0].map(n => { const k = shiftMonth(ui.month, -n), s = monthStats(k); return { k, inc: s.inc, exp: s.exp }; });
  h += `<section class="card pad chart an"><div class="card-h"><h3>Last 6 months</h3>
    <div class="legend-inline"><span><i style="background:#10B981"></i>Income</span><span><i style="background:#8D6BFF"></i>Spent</span></div></div>${barsChart(months)}</section>`;
  h += '</div></div>';
  return h;
}

/* ---------- receipt scanning (on-device OCR) ---------- */
const OCR_JS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const OCR_LANGS = 'https://tessdata.projectnaptha.com/4.0.0_fast';
let ocrLib = null;
function loadOcr() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return ocrLib ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = OCR_JS;
    s.onload = () => res(window.Tesseract);
    s.onerror = () => { ocrLib = null; s.remove(); rej(new Error('load')); };
    document.head.appendChild(s);
  });
}
function startScan() {
  const inp = $('#scanInput');
  inp.value = '';
  inp.click();
}
async function prepImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(2, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(bmp, 0, 0, c.width, c.height);
  const im = x.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    let l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    l = (l - 128) * 1.35 + 140;
    d[i] = d[i + 1] = d[i + 2] = l < 0 ? 0 : l > 255 ? 255 : l;
  }
  x.putImageData(im, 0, 0);
  return c;
}
async function scanReceipt(file) {
  const url = URL.createObjectURL(file);
  let setP = () => {};
  const close = sheet(`${head('Reading receipt', tile('i:receipt', '#7B5CFF'))}
    <div class="scan-prev"><img src="${url}" alt="Receipt photo"><div class="scan-line"></div></div>
    <div class="bar" style="margin-top:16px"><i id="scP" style="width:4%;animation:none;transition:width .3s"></i></div>
    <p class="muted sm center" id="scS" style="margin-top:10px">Getting ready…</p>`,
    el => { setP = (p, t) => { el.querySelector('#scP').style.width = Math.max(4, Math.min(100, p * 100)) + '%'; if (t) el.querySelector('#scS').textContent = t; }; });
  const first = !S.prefs.ocrReady;
  let worker;
  try {
    if (first && !navigator.onLine) throw new Error('offline-first');
    setP(0.05, first ? 'Setting up the receipt reader (one-time, about 3 MB)…' : 'Loading the receipt reader…');
    const T = await loadOcr();
    const canvas = await prepImage(file);
    worker = await T.createWorker(['eng', 'ind'], 1, {
      langPath: OCR_LANGS,
      logger: m => {
        if (m.status === 'recognizing text') setP(0.3 + 0.7 * m.progress, 'Reading the text…');
        else if (typeof m.progress === 'number') setP(0.05 + 0.25 * m.progress);
      },
    });
    const { data } = await worker.recognize(canvas);
    S.prefs.ocrReady = true; save();
    if (!sheets.includes(close)) return;
    close();
    const r = parseReceipt(data.text || '');
    setTimeout(() => txSheet(null, 'expense', r), 260);
  } catch (e) {
    close();
    toast(e.message === 'offline-first' ? 'Connect to the internet once to set up receipt scanning' : "Couldn't read that photo. Try again with a clearer one");
  } finally {
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    try { await worker?.terminate(); } catch (e) {}
  }
}

/* receipt text -> { amount, date, note, cat } */
function parseNum(s) {
  s = s.replace(/\s/g, '');
  const dots = (s.match(/\./g) || []).length, commas = (s.match(/,/g) || []).length;
  if (dots && commas) {
    const dec = s.lastIndexOf('.') > s.lastIndexOf(',') ? '.' : ',';
    s = s.split(dec === '.' ? ',' : '.').join('').replace(dec, '.');
  } else if (dots + commas > 1) s = s.replace(/[.,]/g, '');
  else if (dots + commas === 1) {
    const after = s.split(/[.,]/)[1];
    s = after.length === 3 ? s.replace(/[.,]/, '') : s.replace(',', '.');
  }
  return parseFloat(s) || 0;
}
function amountsIn(line) {
  const out = [];
  for (const m of line.matchAll(/(?<![\d.,])(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d{1,7}(?:[.,]\d{1,2})?)(?![\d])/g)) {
    const v = parseNum(m[1]);
    if (v > 0) out.push(v);
  }
  return out;
}
function findDate(text) {
  const p2 = n => String(n).padStart(2, '0');
  const ok = (y, mo, d) => {
    if (y < 100) y += 2000;
    if (mo < 1 || mo > 12 || d < 1 || d > daysIn(y, mo)) return null;
    const s = `${y}-${p2(mo)}-${p2(d)}`, age = (parseD(today()) - parseD(s)) / 864e5;
    return age >= 0 && age < 400 ? s : null;
  };
  for (const m of text.matchAll(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/g)) { const r = ok(+m[1], +m[2], +m[3]); if (r) return r; }
  for (const m of text.matchAll(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/g)) { const r = ok(+m[3], +m[2], +m[1]) || ok(+m[3], +m[1], +m[2]); if (r) return r; }
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, mei: 5, jun: 6, jul: 7, aug: 8, agu: 8, agt: 8, sep: 9, oct: 10, okt: 10, nov: 11, dec: 12, des: 12 };
  for (const m of text.matchAll(/(\d{1,2})[\s\-]*([A-Za-z]{3})[a-z]*\.?[\s\-,]*(\d{2,4})/g)) {
    const mo = MON[m[2].toLowerCase()];
    if (mo) { const r = ok(+m[3], mo, +m[1]); if (r) return r; }
  }
  return null;
}
const CAT_HINTS = [
  ['Groceries', /indomaret|alfa\s?mart|alfamidi|superindo|hypermart|carrefour|transmart|lotte\s?mart|giant|ranch market|farmers market|grand lucky|supermarket|minimarket|fairprice|cold storage|coles|woolworths|aldi|aeon|grocer/i],
  ['Food & Dining', /starbucks|kopi|coffee|caf[eé]|resto|restaurant|restoran|warung|bakso|\bmie\b|ayam|kfc|mcdonald|\bmcd\b|pizza|burger|sushi|ramen|chatime|janji jiwa|kenangan|solaria|hokben|bakery|makan|dining|boba/i],
  ['Transport', /grab|gojek|go-?jek|pertamina|shell|spbu|parkir|parking|e-?toll|\btol\b|\bmrt\b|\bkrl\b|transjakarta|taxi|bluebird|bensin|pertalite|pertamax|\bbbm\b|fuel|petrol/i],
  ['Bills & Utilities', /\bpln\b|listrik|pdam|telkom|indihome|internet|pulsa|token|bpjs/i],
  ['Health', /apotek|apotik|pharmacy|kimia farma|guardian|watsons|century|klinik|clinic|hospital|rumah sakit|dokter|medical/i],
  ['Shopping', /uniqlo|h&m|zara|matahari|ace hardware|ikea|miniso|daiso|department|fashion|sepatu|shoes/i],
  ['Entertainment', /\bcgv\b|\bxxi\b|cinema|cinepolis|bioskop|karaoke/i],
  ['Travel', /hotel|garuda|lion air|citilink|airasia|traveloka|agoda|booking\.com/i],

function parseReceipt(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const KW = /grand\s*total|total|jumlah|amount\s*due|balance\s*due|tagihan|harus\s*dibayar/i;
  const BAD = /sub\s*-?\s*total|disc|diskon|potongan|hemat|\btax\b|ppn|pajak|service|kembali|change|tunai|cash|debit|kredit|kartu|card|\bqty\b|item|poin|point|voucher|bayar\s*:?\s*$/i;
  let amount = 0, grand = false;

  let cat = null;
  for (const src of [merchant, text]) {
    const hit = CAT_HINTS.find(([, re]) => re.test(src));
    if (hit) { cat = S.cats.find(c => c.kind === 'expense' && c.name === hit[0])?.id || null; break; }
  }
  return { amount: amount > 0 && amount < 1e10 ? amount : 0, date: findDate(text), note: merchant, cat };
}

    const preview = () => {
      const g = grams(), p = goldPrice();
      q('#hV').innerHTML = g && p ? `Worth today ≈ <b style="color:var(--ink)">${money(g * +q('#hK').value * p)}</b>` : '';
    };
    q('#hG').oninput = e => { e.target.value = e.target.value.replace(/[^\d.,]/g, ''); preview(); };
    q('#hK').onchange = preview;
    q('#hC').oninput = e => fmtInput(e.target, S.base);
    preview();
    q('#hS').onclick = () => {
      const g = grams();
      if (!(g > 0)) return q('#hErr').textContent = 'Enter the weight in grams';
      const data = { name: q('#hN').value.trim() || 'Gold', grams: g, purity: +q('#hK').value, cost: num(q('#hC').value), costCur: S.base, date: q('#hD').value };
      if (h) Object.assign(h, data); else S.gold.push({ id: uid(), ...data });
      save(); close(); buzz(); render(); goldSheet();
      toast(h ? 'Saved' : `Added ${g} g of gold`);
    };
    if (h) q('#hDel').onclick = async () => {
      close();
      if (await confirmSheet('Delete this gold?', `“${h.name}” will be removed.`)) { S.gold = S.gold.filter(x => x !== h); save(); render(); }
      goldSheet();
    };
  });
}

/* ---------- sheets: settings ---------- */
function ratesSheet() {
  let live = S.prefs.liveRates !== false;
  const m = S.market;
  sheet(`${head('Exchange rates')}
    <div class="seg" id="xMode" style="margin-bottom:12px"><button data-v="1" class="${live ? 'on' : ''}">Update automatically</button><button data-v="0" class="${live ? '' : 'on'}">Set myself</button></div>
    <p class="muted sm" id="xNote" style="margin-bottom:16px"></p>
    <div class="stack">${CODES.filter(c => c !== S.base).map(c => `<label class="fld"><span>1 ${c} = ? ${S.base}</span><input data-c="${c}" inputmode="decimal" value="${conv(1, c).toLocaleString('en-US', { maximumFractionDigits: conv(1, c) < 1 ? 6 : 4 })}"></label>`).join('')}</div>
    <div class="sh-actions"><button class="btn primary" id="xS">Save</button></div>`,
  (el, close) => {
    const paint = () => {
      el.querySelectorAll('#xMode button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === live));
      el.querySelectorAll('[data-c]').forEach(i => { i.readOnly = live; i.style.opacity = live ? .6 : 1; });
      el.querySelector('#xNote').textContent = live
        ? `Rates update from the market whenever you're online${m.ratesTs ? ` (last ${ago(m.ratesTs)})` : ''}. Offline, the last rates are used.`
        : `Type your own rates. They're used to show totals in ${S.base}.`;
    };
    paint();
    el.querySelector('#xMode').onclick = e => { const b = e.target.closest('button'); if (b) { live = b.dataset.v === '1'; paint(); } };
    el.querySelector('#xS').onclick = async () => {
      S.prefs.liveRates = live;
      if (!live) el.querySelectorAll('[data-c]').forEach(i => { const v = num(i.value); if (v > 0) S.rates[i.dataset.c] = S.rates[S.base] / v; });
      save(); close(); render();
      if (live) { const ok = await refreshMarket(true); if (ok) render(); toast(ok ? 'Live rates updated' : 'Rates will update when online'); }
      else toast('Rates saved');
    };
  });
}
function baseSheet() {
  sheet(`${head('Main currency')}<p class="muted sm" style="margin-bottom:16px">Totals, budgets and charts are shown in this currency. Each account keeps its own.</p>
    <div class="card list">${CODES.map(c => `<button class="row" data-c="${c}"><span class="ic" style="--c:#7B5CFF;font-size:13px;font-weight:800">${CUR[c].sym}</span><span class="row-m"><b>${c}</b><small>${CUR[c].name}</small></span>${c === S.base ? `<span class="pos">${svg('check', 20, 2.6)}</span>` : ''}</button>`).join('')}</div>`,
  (el, close) => {
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-c]'); if (!b) return;
      const nb = b.dataset.c, old = S.base;
      if (nb !== old) { for (const k in S.budgets) S.budgets[k] = niceRound(conv(S.budgets[k], old, nb), nb); S.base = nb; save(); render(); toast(`Main currency is now ${nb}`); }
      close();
    });
  });
}
function nameSheet() {
  sheet(`${head('Your name')}<label class="fld"><span>What should Kantong call you?</span><input id="nN" maxlength="30" value="${esc(S.prefs.name)}"></label><div class="sh-actions"><button class="btn primary" id="nS">Save</button></div>`,
    (el, close) => {
      const go = () => { S.prefs.name = el.querySelector('#nN').value.trim(); save(); close(); render(); };
      el.querySelector('#nS').onclick = go;
      el.querySelector('#nN').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportBackup() {
  S.prefs.lastBackup = Date.now(); save();
  download(`kantong-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json');
  render(); toast('Backup saved to Downloads');
}
function exportCSV() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date', 'Type', 'Amount', 'Currency', 'Category', 'Account', 'To account', 'Amount received', 'Note', `Amount in ${S.base}`]];
  for (const t of sortTx([...S.tx]).reverse()) {
    const c = accCur(t.account);
    rows.push([t.date, t.type, t.amount, c, t.type === 'transfer' ? '' : catOf(t.cat).name, accName(t.account), t.to ? accName(t.to) : '', t.to ? t.toAmount : '', t.note, roundC(conv(t.amount, c), S.base)]);
  }
  download(`kantong-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
  toast('Spreadsheet exported');
}
function importBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.accounts) || !Array.isArray(d.tx) || !Array.isArray(d.cats) || !CUR[d.base]) throw 0;
      if (!await confirmSheet('Restore this backup?', `It has ${d.tx.length} transactions and ${d.accounts.length} accounts. It replaces everything currently on this device.`, 'Restore', false)) return;
      d.budgets ||= {}; d.recurring ||= []; d.goals ||= []; d.rates = { ...newState(d.base).rates, ...d.rates }; d.prefs = { ...newState(d.base).prefs, ...d.prefs };
      S = migrate(d); save(); applyTheme(); processRecurring(); ui.view = 'home'; lastView = null; render(true); toast('Backup restored');
    } catch (e) { toast("That file isn't a Kantong backup"); }
  };
  inp.click();
}

/* ---------- welcome & sample ---------- */
function welcome() {
  let base = 'IDR';
  document.body.classList.add('welcoming');
  sheet(`<div class="welcome">
    <div class="w-art"><div class="acard t-cash"><div class="ac-top">${svg('cash', 20, 2)}</div><div class="ac-bal">Rp 2.5M</div></div>
      <div class="acard t-ewallet"><div class="ac-top">${svg('phone', 20, 2)}</div><div class="ac-bal">S$ 840</div></div>
      <div class="acard t-bank"><div class="ac-top">${svg('bank', 20, 2)}<span class="ac-cur">IDR</span></div><div><div class="ac-name">Total balance</div><div class="ac-bal">Rp 108.7M</div></div></div></div>
    <h2>Your money,<br><span class="grad">beautifully simple.</span></h2>
    <p>Track spending, plan budgets and grow your savings. Everything stays on this device.</p>
    <div class="stack" style="text-align:left">
      <label class="fld"><span>What should I call you?</span><input id="wN" maxlength="30" placeholder="Your name (optional)"></label>
      <div class="fld"><span>Pick a look (you can change it later)</span><div class="style-pick" id="wS">
        <button type="button" data-v="classic" class="on"><span class="sw" style="background:linear-gradient(135deg,#5A2BD9,#8E3BE8)"></span>Classic</button>
        <button type="button" data-v="cute"><span class="sw" style="background:linear-gradient(135deg,#FFB3CF,#FFD9C2)"></span>Cute 🌸</button></div></div>
      <div class="fld"><span>Main currency</span><div class="cur-pick" id="wC">${CODES.map(c => `<button type="button" data-v="${c}" class="${c === base ? 'on' : ''}">${c}<small>${CUR[c].sym}</small></button>`).join('')}</div></div>
    </div>
    <div class="stack" style="margin-top:22px"><button class="btn primary block" id="wGo">Get started</button><button class="btn ghost block" id="wDemo">Explore with sample data first</button></div>
    <p class="muted sm" style="margin-top:12px">You can erase sample data anytime in Settings.</p></div>`,
  (el, close) => {
    el.querySelector('#wC').onclick = e => { const b = e.target.closest('button'); if (!b) return; base = b.dataset.v; el.querySelectorAll('#wC button').forEach(x => x.classList.toggle('on', x === b)); };
    let style = 'classic';
    el.querySelector('#wS').onclick = e => {
      const b = e.target.closest('button'); if (!b) return; style = b.dataset.v;
      el.querySelectorAll('#wS button').forEach(x => x.classList.toggle('on', x === b));
      if (style === 'cute') document.documentElement.dataset.style = 'cute'; else delete document.documentElement.dataset.style;
    };
    const start = demo => {
      S = newState(base, el.querySelector('#wN').value.trim());
      S.prefs.style = style;
      if (demo) sampleData();
      document.body.classList.remove('welcoming');
      save(); close(); applyTheme(); lastView = null; render(true); liveUpdate();
      navigator.storage?.persist?.().catch(() => {});
      toast(demo ? 'Sample data loaded. Have a look around!' : 'All set. Tap + to add a transaction');
    };
    el.querySelector('#wGo').onclick = () => start(false);
    el.querySelector('#wDemo').onclick = () => start(true);
  }, { locked: true });
}
function sampleData() {
  idx();
  const b = S.base, fx = v => niceRound(conv(v, 'USD', b), b) || 1;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const C = n => S.cats.find(c => c.name === n).id;
  const [cash, bank] = S.accounts;
  cash.start = fx(120); bank.start = fx(2600);
  const fc = b === 'JPY' ? 'USD' : 'JPY';
  const travel = { id: uid(), name: 'Travel card', type: 'card', currency: fc, start: niceRound(conv(300, 'USD', fc), fc) };
  const wallet = { id: uid(), name: 'E-wallet', type: 'ewallet', currency: b, start: fx(25) };
  const savings = { id: uid(), name: 'Savings', type: 'savings', currency: b, start: fx(1850) };
  S.accounts.push(wallet, savings, travel);
  const now = new Date(), tx = [];
  const add = (type, acc, amount, cat, date, note) => tx.push({ id: uid(), ts: Date.now() + tx.length, type, account: acc.id, amount, cat, date, note });
  const xfer = (from, to, amount, date, note) => tx.push({ id: uid(), ts: Date.now() + tx.length, type: 'transfer', account: from.id, to: to.id, amount, toAmount: amount, date, note });
  for (let mo = 2; mo >= 0; mo--) {
    const first = new Date(now.getFullYear(), now.getMonth() - mo, 1), y = first.getFullYear(), m = first.getMonth();
    const last = mo === 0 ? now.getDate() : daysIn(y, m + 1);
    const D = d => iso(new Date(y, m, Math.min(d, last)));
    add('income', bank, fx(2400), C('Salary'), D(1), 'Monthly salary');
    if (last >= 3) add('expense', bank, fx(650), C('Housing'), D(3), 'Rent');
    if (last >= 7) add('expense', bank, fx(70 + Math.random() * 30), C('Bills & Utilities'), D(7), 'Electricity & internet');
    if (last >= 15) add('expense', bank, fx(12), C('Subscriptions'), D(15), 'Streaming');
    if (last >= 20 && Math.random() > .4) add('income', bank, fx(150 + Math.random() * 250), C('Business'), D(20), 'Freelance project');
    if (last >= 2) { xfer(bank, wallet, fx(150), D(2), 'Top up e-wallet'); xfer(bank, cash, fx(120), D(2), 'ATM withdrawal'); }
    if (last >= 16) xfer(bank, cash, fx(120), D(16), 'ATM withdrawal');
    if (last >= 25) xfer(bank, savings, fx(300), D(25), 'Monthly saving');
    for (let d = 1; d <= last; d++) {
      const ds = D(d);
      if (Math.random() > .25) add('expense', Math.random() > .5 ? cash : wallet, fx(3 + Math.random() * 9), C('Food & Dining'), ds, pick(['Lunch', 'Coffee', 'Breakfast', 'Nasi goreng', 'Bakso', 'Bubble tea', '']));
      if (Math.random() > .55) add('expense', wallet, fx(2 + Math.random() * 7), C('Transport'), ds, pick(['Ride to work', 'Train', 'Fuel', '']));
      if (d % 4 === 0) add('expense', bank, fx(25 + Math.random() * 35), C('Groceries'), ds, pick(['Supermarket', 'Weekly groceries', 'Market']));
      if (Math.random() > .9) add('expense', bank, fx(20 + Math.random() * 60), C('Shopping'), ds, pick(['New shoes', 'Clothes', 'Home stuff', 'Online order']));
      if (Math.random() > .92) add('expense', cash, fx(10 + Math.random() * 25), C('Entertainment'), ds, pick(['Movies', 'Concert', 'Karaoke']));
      if (Math.random() > .96) add('expense', bank, fx(15 + Math.random() * 40), C('Health'), ds, pick(['Pharmacy', 'Doctor visit']));
    }
    if (mo === 1) {
      for (const [d, v, n, cn] of [[12, 40, 'Hotel night', 'Travel'], [13, 18, 'Ramen', 'Food & Dining'], [13, 25, 'Train pass', 'Travel'], [14, 60, 'Souvenirs', 'Shopping']]) {
        if (d <= last) add('expense', travel, niceRound(conv(v, 'USD', fc), fc), C(cn), D(d), n);
      }
    }
  }
  S.tx = tx;
  for (const [n, v] of [['Food & Dining', 230], ['Groceries', 200], ['Transport', 90], ['Shopping', 120], ['Entertainment', 60], ['Housing', 650], ['Bills & Utilities', 110]]) S.budgets[C(n)] = fx(v);
  const nextOf = d => { const n = iso(new Date(now.getFullYear(), now.getMonth(), Math.min(d, daysIn(now.getFullYear(), now.getMonth() + 1)))); return n <= today() ? advance(n, 'monthly', d) : n; };
  S.recurring = [
    { id: uid(), freq: 'monthly', day: 1, next: nextOf(1), active: true, tpl: { type: 'income', amount: fx(2400), account: bank.id, cat: C('Salary'), note: 'Monthly salary' } },
    { id: uid(), freq: 'monthly', day: 3, next: nextOf(3), active: true, tpl: { type: 'expense', amount: fx(650), account: bank.id, cat: C('Housing'), note: 'Rent' } },
    { id: uid(), freq: 'monthly', day: 15, next: nextOf(15), active: true, tpl: { type: 'expense', amount: fx(12), account: bank.id, cat: C('Subscriptions'), note: 'Streaming' } },
  ];
  for (const t of S.tx) { const r = S.recurring.find(r => r.tpl.note === t.note); if (r) t.recurId = r.id; }
  const gPaid = (g, usdOz, k = 0.9999) => niceRound(conv(g * k * usdOz / 31.1034768, 'USD', b), b);
  const ago3 = new Date(now); ago3.setMonth(now.getMonth() - 5);
  const ago1 = new Date(now); ago1.setMonth(now.getMonth() - 1);
  S.gold = [
    { id: uid(), name: 'Antam bar', grams: 10, purity: 0.9999, cost: gPaid(10, 3500), costCur: b, date: iso(ago3) },
    { id: uid(), name: 'Gold ring', grams: 4.5, purity: 0.75, cost: gPaid(4.5, 3900, 0.75), costCur: b, date: iso(ago1) },
  ];
  const dl = n => mkey(new Date(now.getFullYear(), now.getMonth() + n, 1));
  S.goals = [
    { id: uid(), name: 'Emergency fund', icon: 'i:shield', target: fx(5000), saved: fx(1850), currency: b, deadline: dl(10) },
    { id: uid(), name: 'Trip to Japan', icon: 'i:plane', target: niceRound(conv(2500, 'USD', 'JPY'), 'JPY'), saved: niceRound(conv(800, 'USD', 'JPY'), 'JPY'), currency: 'JPY', deadline: dl(7) },
  ];
}

/* ---------- actions ---------- */
const A = {
  nav: id => { if (ui.view !== id) { ui.view = id; render(true); } else window.scrollTo({ top: 0, behavior: 'smooth' }); },
  month: id => { ui.month = +id === 0 ? mkey(new Date()) : shiftMonth(ui.month, +id); lastView = null; render(); },
  add: id => txSheet(null, id),
  tx: id => { const t = S.tx.find(x => x.id === id); if (t) txSheet(t); },
  ft: id => { ui.ft = id; render(); },
  budget: id => budgetSheet(id),
  goal: id => goalSheet(id),
  goalMoney: id => goalMoneySheet(id),
  acc: id => accSheet(id),
  rec: id => recSheet(id),
  cats: () => catsSheet(),
  rates: () => ratesSheet(),
  gold: () => goldSheet(),
  scan: () => startScan(),
  base: () => baseSheet(),
  name: () => nameSheet(),
  hide: () => { S.prefs.hide = !S.prefs.hide; save(); render(); },
  theme: id => { S.prefs.theme = id; save(); applyTheme(); render(); },
  style: id => { S.prefs.style = id; save(); applyTheme(); lastView = null; render(); toast(id === 'cute' ? 'Cute style on 🌸' : 'Classic style on'); },
  export: () => exportBackup(),
  import: () => importBackup(),
  csv: () => exportCSV(),
  install: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice.catch(() => {}); deferredPrompt = null; render(); },
  dismissInstall: () => { S.prefs.installDismissed = true; save(); render(); },
  erase: async () => {
    if (!await confirmSheet('Erase everything?', 'All accounts, transactions, budgets and goals on this device will be deleted. Make a backup first if you might want them later.', 'Erase all')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = null; ui.view = 'home'; ui.month = mkey(new Date()); lastView = null; $('#main').innerHTML = '';
    delete document.documentElement.dataset.style; applyTheme(); welcome();
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || !S) return;
  const f = A[b.dataset.a];
  if (f) f(b.dataset.id, b, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheets.length) { const c = sheets[sheets.length - 1]; if (!c.locked) c(); return; }
  if (!S || sheets.length || e.ctrlKey || e.metaKey || e.altKey || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); txSheet(); }
});
$('#scanInput').addEventListener('change', e => { const f = e.target.files[0]; if (f && S) scanReceipt(f); });
const liveUpdate = () => refreshMarket().then(c => { if (c && S && !sheets.length && ui.view !== 'activity') render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S) return;
  if (today() !== lastDay) { lastDay = today(); processRecurring(); render(); }
  liveUpdate();
});
addEventListener('online', liveUpdate);
setInterval(liveUpdate, 15 * 60e3);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (S && (ui.view === 'home' || ui.view === 'more')) render(); });
addEventListener('appinstalled', () => { deferredPrompt = null; toast('Kantong is installed'); if (S) render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

buildChrome();
applyTheme();
if (S) { save(); processRecurring(); render(); liveUpdate(); } else welcome();
})();
</script>
